<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <title>Authenticator</title>
</head>
<body>
  <div class="app">
    <header class="header">
      <button id="btn-github" class="icon-btn" title="GitHub">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.78 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.12 3.05.74.8 1.19 1.82 1.19 3.08 0 4.41-2.69 5.38-5.25 5.67.41.35.77 1.05.77 2.12 0 1.53-.01 2.76-.01 3.14 0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"/></svg>
      </button>
      <h1 id="app-title">Authenticator</h1>
      <div class="header-actions">
        <button id="btn-settings" class="icon-btn" title="设置">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z" fill="currentColor"/></svg>
        </button>
        <button id="btn-add" class="icon-btn" title="添加账户">
          <svg viewBox="0 0 24 24" width="24" height="24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/></svg>
        </button>
        <button id="btn-auto-scan" class="icon-btn" title="自动扫描当前页">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9.5 13.5L2 19l2 1 5.5-3.5L14 20l8-6-2-1-5.5 3.5L9.5 13.5zM3 8l4 2 3-6 4 8 7-4-2-1-4 2-3-6-4 8-7-4 2 1z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <div id="account-list" class="account-list"></div>

    <div id="empty-state" class="empty-state" style="display:none;">
      <svg viewBox="0 0 24 24" width="48" height="48"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.98 4-3.08 6-3.08 1.99 0 5.97 1.1 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" fill="currentColor"/></svg>
      <p id="empty-title">暂无账户</p>
      <p id="empty-hint" class="hint">点击右上角 + 添加账户</p>
    </div>

    <footer class="footer"><span id="footer-notice">所有数据仅存储在本地，不会上传至任何服务器</span></footer>

    <div id="add-modal" class="modal" style="display:none;">
      <div class="modal-content">
        <h2 id="modal-title">添加账户</h2>
        <div class="form-group">
          <label for="input-name" id="label-name">账户名称</label>
          <input id="input-name" type="text" placeholder="例如：GitHub" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="input-secret" id="label-secret">密钥</label>
          <input id="input-secret" type="text" placeholder="例如：JBSWY3DPEHPK3PXP" autocomplete="off" spellcheck="false">
          <span id="secret-error" class="error-text" style="display:none;"></span>
        </div>
        <div class="form-group">
          <label id="label-type">密钥类型</label>
          <div class="type-badge" id="type-badge-text">基于时间</div>
        </div>
        <div class="form-group scan-method-group">
          <label id="label-scan-method">快捷绑定</label>
          <div class="scan-methods">
            <button id="btn-scan-screen" class="btn btn-scan-method">
              <svg viewBox="0 0 24 24" width="16" height="16"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zm-5.04-6.71l-2.75 3.54-1.96-2.36L8.5 17H15.5z" fill="currentColor"/></svg>
              <span id="scan-screen-text">截屏识别</span>
            </button>
            <button id="btn-scan-file" class="btn btn-scan-method">
              <svg viewBox="0 0 24 24" width="16" height="16"><path d="M19 7v2H5V7H3v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7h-2zm-4-4H9v2H5v2h14V5h-4V3z" fill="currentColor"/></svg>
              <span id="scan-file-text">选择图片</span>
            </button>
          </div>
          <p id="scan-method-desc" class="scan-method-desc">截取当前页面或从本地选择二维码图片，自动识别并绑定</p>
        </div>
        <div class="modal-actions">
          <button id="btn-cancel" class="btn btn-cancel">取消</button>
          <button id="btn-save" class="btn btn-save">保存</button>
        </div>
      </div>
    </div>

    <div id="delete-modal" class="modal" style="display:none;">
      <div class="modal-content">
        <h2 id="delete-modal-title">删除账户</h2>
        <p id="delete-confirm-text"></p>
        <div class="modal-actions">
          <button id="btn-delete-cancel" class="btn btn-cancel">取消</button>
          <button id="btn-delete-confirm" class="btn btn-danger">删除</button>
        </div>
      </div>
    </div>

    <div id="settings-modal" class="modal" style="display:none;">
      <div class="modal-content">
        <h2 id="settings-title">设置</h2>
        <div class="form-group">
          <label id="label-language">语言</label>
          <div class="lang-options">
            <button id="btn-lang-zh" class="lang-btn active" data-lang="zh-CN">中文</button>
            <button id="btn-lang-en" class="lang-btn" data-lang="en">English</button>
          </div>
        </div>
        <div class="form-group">
          <label id="label-export">导出数据</label>
          <p id="export-desc" class="export-desc">将所有账户和密钥导出为 ZIP 压缩包</p>
          <button id="btn-export" class="btn btn-export">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" fill="currentColor"/></svg>
            <span id="export-btn-text">导出</span>
          </button>
        </div>
        <div class="form-group">
          <label id="label-import">导入数据</label>
          <p id="import-desc" class="export-desc">从导出的 ZIP 压缩包中导入账户和密钥</p>
          <button id="btn-import" class="btn btn-export">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z" fill="currentColor"/></svg>
            <span id="import-btn-text">导入</span>
          </button>
        </div>
        <div class="modal-actions">
          <button id="btn-settings-close" class="btn btn-cancel">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="jsQR.js"></script>
  <script src="totp.js"></script>
  <script src="export.js"></script>
  <script src="import.js"></script>
  <script src="popup.js"></script>
</body>
</html>
